name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, test, and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --no-pub -r expanded

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Build Android App Bundle
        run: flutter build appbundle --debug

  api:
    name: API generate, typecheck, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  postgres:
    name: PostgreSQL migration and seed validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashflow_manager
          POSTGRES_USER: cashflow_app
          POSTGRES_PASSWORD: change-me-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow_app -d cashflow_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://cashflow_app:change-me-local-only@localhost:5432/cashflow_manager?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Seed database
        run: npm run db:seed

  docker:
    name: Docker Compose and image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --build-arg REVISION=${{ github.sha }} -f api/Dockerfile -t cashflow-manager-api:ci .

      - name: Build frontend artifact image
        run: docker build --build-arg REVISION=${{ github.sha }} -f Dockerfile.frontend -t cashflow-manager-frontend:ci .
