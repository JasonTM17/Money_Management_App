name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, test, and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub -r expanded

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Build Android App Bundle
        run: flutter build appbundle --debug

  android-emulator-smoke:
    name: Android emulator integration smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run smoke flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: medium_phone
          script: flutter test --no-pub integration_test/cashflow_smoke_test.dart -d emulator-5554 -r expanded --timeout 10m

  ios:
    name: iOS simulator smoke and no-codesign build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub -r expanded

      - name: Select iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ {print $2; exit}')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "IOS_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run smoke flow on iOS simulator
        run: flutter test --no-pub integration_test/cashflow_smoke_test.dart -d "$IOS_SIMULATOR_ID" -r expanded --timeout 10m

      - name: Build iOS without codesigning
        run: flutter build ios --release --no-codesign --no-pub

  api:
    name: API generate, typecheck, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashflow_manager
          POSTGRES_USER: cashflow_app
          POSTGRES_PASSWORD: change-me-local-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cashflow_app -d cashflow_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit API dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=moderate || true

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://cashflow_app:change-me-local-only@localhost:5433/cashflow_manager?schema=public

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://cashflow_app:change-me-local-only@localhost:5433/cashflow_manager?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  postgres:
    name: PostgreSQL migration and seed validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashflow_manager
          POSTGRES_USER: cashflow_app
          POSTGRES_PASSWORD: change-me-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow_app -d cashflow_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://cashflow_app:change-me-local-only@localhost:5432/cashflow_manager?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Seed database
        run: npm run db:seed

  docker:
    name: Docker Compose and image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --build-arg REVISION=${{ github.sha }} -f api/Dockerfile -t cashflow-manager-api:ci .

      - name: Build frontend artifact image
        run: docker build --build-arg REVISION=${{ github.sha }} -f Dockerfile.frontend -t cashflow-manager-frontend:ci .
