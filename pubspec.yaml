name: cashflow_manager
description: "Offline-first personal expense and cashflow manager for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  fl_chart: ^1.1.1
  sqlite3: ^3.5.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.6
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  csv: ^8.0.0
  crypto: ^3.0.6
  pdf: ^3.13.0
  printing: ^5.15.0
  cupertino_icons: ^1.0.8
  share_plus: 12.0.2
  file_picker: 10.3.7
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/noto-sans-jp-vf.ttf
  assets:
    - assets/brand/
    - assets/fonts/noto-sans-jp-vf.ttf
    - assets/fonts/OFL.txt
