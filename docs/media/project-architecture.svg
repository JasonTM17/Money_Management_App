<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">CashFlow Manager architecture diagram</title>
  <desc id="desc">Offline-first Flutter app, optional Fastify API, PostgreSQL, n8n automation, local quality gates, container registries, and GitHub repository package sidebar.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif; }
    .title { fill:#10231f; font-size:30px; font-weight:700; }
    .subtitle { fill:#5f6f68; font-size:14px; }
    .group-title { fill:#10231f; font-size:17px; font-weight:700; }
    .label { fill:#1f2f2a; font-size:13px; font-weight:650; }
    .sub { fill:#60706a; font-size:12px; }
    .tiny { fill:#60706a; font-size:11px; }
    .badge { fill:#116b47; font-size:11px; font-weight:700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#16a34a"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#ea580c"/></marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f2a2415"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="712" rx="22" fill="#f8faf7" stroke="#d9e5df" stroke-width="1.5"/>
  <text x="56" y="70" class="title">CashFlow Manager Architecture</text>
  <text x="56" y="96" class="subtitle">Offline-first finance app with optional sync, automation, and package publishing lanes.</text>
  <g filter="url(#soft)">
    <rect x="56" y="126" width="252" height="286" rx="14" fill="#ffffff" stroke="#cbd8d2" stroke-width="1.5"/>
  </g>
  <text x="76" y="160" class="group-title">Flutter mobile app</text>
  <text x="76" y="182" class="sub">Private local finance by default</text>
  <rect x="80" y="202" width="204" height="54" rx="8" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.3"/>
  <text x="96" y="224" class="label">UI shell</text>
  <text x="96" y="242" class="sub">Dashboard, wallets, reports</text>
  <rect x="80" y="272" width="204" height="54" rx="8" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.3"/>
  <text x="96" y="294" class="label">State + finance logic</text>
  <text x="96" y="312" class="sub">Riverpod, integer VND, alerts</text>
  <rect x="80" y="342" width="204" height="54" rx="8" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.3"/>
  <text x="96" y="364" class="label">Local data + privacy</text>
  <text x="96" y="382" class="sub">SQLite, PIN, biometrics, backup</text>
  <g filter="url(#soft)">
    <rect x="382" y="126" width="252" height="286" rx="14" fill="#f9fffb" stroke="#cbd8d2" stroke-width="1.5"/>
  </g>
  <text x="402" y="160" class="group-title">Fastify API</text>
  <text x="402" y="182" class="sub">Optional account sync boundary</text>
  <rect x="406" y="202" width="204" height="54" rx="8" fill="#ffffff" stroke="#cbd8d2" stroke-width="1.3"/>
  <text x="422" y="224" class="label">Trust boundary</text>
  <text x="422" y="242" class="sub">JWT/JWKS, validation, rate limits</text>
  <rect x="406" y="272" width="204" height="54" rx="8" fill="#ffffff" stroke="#cbd8d2" stroke-width="1.3"/>
  <text x="422" y="294" class="label">Finance + sync routes</text>
  <text x="422" y="312" class="sub">Accounts, wallets, transactions</text>
  <rect x="406" y="342" width="204" height="54" rx="8" fill="#ffffff" stroke="#cbd8d2" stroke-width="1.3"/>
  <text x="422" y="364" class="label">Automation proxy</text>
  <text x="422" y="382" class="sub">HMAC signed n8n analysis</text>
  <rect x="710" y="152" width="210" height="86" rx="12" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.5"/>
  <text x="728" y="180" class="label">PostgreSQL 16</text>
  <text x="728" y="200" class="sub">Server-side persistence</text>
  <rect x="710" y="282" width="210" height="86" rx="12" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.5"/>
  <text x="728" y="310" class="label">n8n workflow</text>
  <text x="728" y="330" class="sub">HMAC verified AI analysis</text>
  <rect x="978" y="218" width="166" height="86" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="996" y="246" class="label">AI provider</text>
  <text x="996" y="266" class="sub">OpenAI-compatible API</text>
  <path d="M 308 272 L 382 272" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="318" y="246" width="102" height="20" rx="5" fill="#f8faf7" opacity="0.96"/>
  <text x="324" y="260" class="tiny">HTTPS / OpenAPI</text>
  <path d="M 634 226 L 674 226 L 674 195 L 710 195" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="642" y="202" width="62" height="20" rx="5" fill="#f8faf7" opacity="0.96"/>
  <text x="648" y="216" class="tiny">Prisma</text>
  <path d="M 634 355 L 710 325" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="642" y="330" width="62" height="20" rx="5" fill="#f8faf7" opacity="0.96"/>
  <text x="648" y="344" class="tiny">HMAC</text>
  <path d="M 920 325 L 950 325 L 950 260 L 978 260" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="924" y="302" width="96" height="20" rx="5" fill="#f8faf7" opacity="0.96"/>
  <text x="930" y="316" class="tiny">minimal prompt</text>
  <text x="56" y="478" class="group-title">Release and repository evidence</text>
  <text x="56" y="500" class="sub">Badges are temporary static green while GitHub Actions quota/token is exhausted; local gates and manifests remain documented evidence.</text>
  <rect x="56" y="538" width="220" height="96" rx="12" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.5"/>
  <text x="74" y="566" class="label">Local quality gates</text>
  <text x="74" y="586" class="sub">Flutter, API, Docker, security</text>
  <rect x="78" y="602" width="108" height="22" rx="11" fill="#dcfce7" stroke="#86d39f"/>
  <text x="94" y="617" class="badge">VERIFIED</text>
  <rect x="330" y="538" width="220" height="96" rx="12" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.5"/>
  <text x="348" y="566" class="label">GitHub Actions</text>
  <text x="348" y="586" class="sub">Remote CI/CD deferred by quota</text>
  <rect x="352" y="602" width="132" height="22" rx="11" fill="#dcfce7" stroke="#86d39f"/>
  <text x="370" y="617" class="badge">DEFERRED</text>
  <rect x="604" y="538" width="220" height="96" rx="12" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.5"/>
  <text x="622" y="566" class="label">Container packages</text>
  <text x="622" y="586" class="sub">GHCR + Docker Hub manifests</text>
  <rect x="626" y="602" width="142" height="22" rx="11" fill="#dcfce7" stroke="#86d39f"/>
  <text x="644" y="617" class="badge">MANIFESTS OK</text>
  <rect x="878" y="538" width="240" height="96" rx="12" fill="#eefaf3" stroke="#bfe3ce" stroke-width="1.5"/>
  <text x="896" y="566" class="label">GitHub repo sidebar</text>
  <text x="896" y="586" class="sub">Packages should link to this repo</text>
  <rect x="900" y="602" width="150" height="22" rx="11" fill="#dcfce7" stroke="#86d39f"/>
  <text x="916" y="617" class="badge">SOURCE LABELED</text>
  <path d="M 276 586 L 330 586" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="286" y="514" width="62" height="20" rx="5" fill="#f8faf7" opacity="0.96"/>
  <text x="292" y="528" class="tiny">evidence</text>
  <path d="M 550 586 L 604 586" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="560" y="514" width="90" height="20" rx="5" fill="#f8faf7" opacity="0.96"/>
  <text x="566" y="528" class="tiny">publish later</text>
  <path d="M 824 586 L 878 586" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="834" y="514" width="72" height="20" rx="5" fill="#f8faf7" opacity="0.96"/>
  <text x="840" y="528" class="tiny">OCI source</text>
  <g transform="translate(56, 680)">
    <line x1="0" y1="8" x2="36" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="46" y="12" class="tiny">App/API request flow</text>
    <line x1="198" y1="8" x2="234" y2="8" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="244" y="12" class="tiny">Verified data or package evidence</text>
    <line x1="446" y1="8" x2="482" y2="8" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/><text x="492" y="12" class="tiny">Optional automation / deferred remote work</text>
  </g>
</svg>