<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CashFlow Manager project architecture</title>
  <desc id="desc">Offline-first Flutter mobile app with optional Fastify API, PostgreSQL, n8n automation, and CI/CD publishing to GHCR and Docker Hub.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .panel { fill: #ffffff; stroke: #d8d5cb; stroke-width: 1.4; rx: 8; }
      .panel-dark { fill: #12332c; stroke: #0b261f; stroke-width: 1.4; rx: 8; }
      .title { fill: #10231f; font: 700 30px "Segoe UI", Arial, sans-serif; }
      .subtitle { fill: #55615d; font: 400 16px "Segoe UI", Arial, sans-serif; }
      .section-title { fill: #10231f; font: 700 18px "Segoe UI", Arial, sans-serif; }
      .section-title-light { fill: #f7f5ef; font: 700 18px "Segoe UI", Arial, sans-serif; }
      .text { fill: #27332f; font: 400 14px "Segoe UI", Arial, sans-serif; }
      .text-light { fill: #e9f1ed; font: 400 14px "Segoe UI", Arial, sans-serif; }
      .small { fill: #64716c; font: 400 12px "Segoe UI", Arial, sans-serif; }
      .small-light { fill: #bad4ca; font: 400 12px "Segoe UI", Arial, sans-serif; }
      .tag { fill: #eef8f2; stroke: #acd8bf; stroke-width: 1; rx: 6; }
      .tag-text { fill: #125b3f; font: 700 12px "Segoe UI", Arial, sans-serif; }
      .line { fill: none; stroke: #16855b; stroke-width: 2.4; }
      .line-muted { fill: none; stroke: #94a09b; stroke-width: 2; stroke-dasharray: 7 7; }
      .line-dark { fill: none; stroke: #f0b84b; stroke-width: 2.4; }
      .icon { fill: #16855b; }
      .icon-gold { fill: #cf8d1b; }
      .shadow { filter: drop-shadow(0 14px 24px rgba(18, 51, 44, 0.12)); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#16855b" />
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a09b" />
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0b84b" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" />
  <text x="60" y="62" class="title">CashFlow Manager Architecture</text>
  <text x="60" y="92" class="subtitle">Offline-first mobile finance, optional sync backend, automation workflow, and release pipeline.</text>

  <g class="shadow">
    <rect x="60" y="130" width="320" height="485" class="panel" />
    <text x="90" y="170" class="section-title">Flutter Mobile App</text>
    <text x="90" y="196" class="small">Android and iOS, works fully offline</text>

    <rect x="88" y="226" width="264" height="62" class="tag" />
    <text x="108" y="251" class="tag-text">UI shell</text>
    <text x="108" y="273" class="text">Dashboard, wallets, reports</text>

    <rect x="88" y="314" width="264" height="62" class="tag" />
    <text x="108" y="339" class="tag-text">State and finance logic</text>
    <text x="108" y="361" class="text">Riverpod, integer VND, forecasts, alerts</text>

    <rect x="88" y="402" width="264" height="62" class="tag" />
    <text x="108" y="427" class="tag-text">Local data and privacy</text>
    <text x="108" y="449" class="text">SQLite, PIN, biometrics, backup</text>

    <rect x="88" y="490" width="264" height="62" class="tag" />
    <text x="108" y="515" class="tag-text">Export and portability</text>
    <text x="108" y="537" class="text">CSV, PDF, restore preview, media</text>
  </g>

  <g class="shadow">
    <rect x="440" y="130" width="320" height="485" class="panel-dark" />
    <text x="470" y="170" class="section-title-light">Fastify API</text>
    <text x="470" y="196" class="small-light">Node.js 26, TypeScript, Prisma, OpenAPI</text>

    <rect x="468" y="226" width="264" height="62" class="panel" />
    <text x="488" y="251" class="tag-text">Trust boundary</text>
    <text x="488" y="273" class="text">JWT/JWKS, validation, rate limits</text>

    <rect x="468" y="314" width="264" height="62" class="panel" />
    <text x="488" y="339" class="tag-text">Finance and sync routes</text>
    <text x="488" y="361" class="text">Accounts, wallets, transactions</text>

    <rect x="468" y="402" width="264" height="62" class="panel" />
    <text x="488" y="427" class="tag-text">Automation proxy</text>
    <text x="488" y="449" class="text">HMAC signed n8n analysis requests</text>

    <rect x="468" y="490" width="264" height="62" class="panel" />
    <text x="488" y="515" class="tag-text">Operational contracts</text>
    <text x="488" y="537" class="text">health, ready, metrics, OpenAPI</text>
  </g>

  <g class="shadow">
    <rect x="820" y="130" width="320" height="224" class="panel" />
    <text x="850" y="170" class="section-title">Data and Automation</text>
    <text x="850" y="196" class="small">Optional services for server-backed use</text>

    <rect x="848" y="226" width="264" height="44" class="tag" />
    <text x="868" y="254" class="text">PostgreSQL 16 for API persistence</text>
    <rect x="848" y="286" width="264" height="44" class="tag" />
    <text x="868" y="314" class="text">n8n workflow with HMAC verification</text>
  </g>

  <g class="shadow">
    <rect x="820" y="390" width="320" height="225" class="panel" />
    <text x="850" y="430" class="section-title">Delivery Pipeline</text>
    <text x="850" y="456" class="small">Quality gates before packages ship</text>

    <rect x="848" y="486" width="264" height="44" class="tag" />
    <text x="868" y="514" class="text">GitHub Actions: analyze, test, build</text>
    <rect x="848" y="546" width="264" height="44" class="tag" />
    <text x="868" y="574" class="text">GHCR and Docker Hub container packages</text>
  </g>

  <path class="line" d="M380 350 C410 350 410 350 440 350" marker-end="url(#arrow)" />
  <text x="389" y="334" class="small">HTTPS / OpenAPI</text>

  <path class="line-dark" d="M760 300 C790 300 790 270 820 270" marker-end="url(#arrow-gold)" />
  <text x="766" y="252" class="small">Prisma</text>

  <path class="line-dark" d="M760 430 C790 430 790 310 820 310" marker-end="url(#arrow-gold)" />
  <text x="766" y="410" class="small">HMAC webhook</text>

  <path class="line-muted" d="M760 520 C800 520 800 520 820 520" marker-end="url(#arrow-muted)" />
  <text x="766" y="502" class="small">CI publish</text>

  <path class="line-muted" d="M600 615 C600 660 980 660 980 615" marker-end="url(#arrow-muted)" />
  <rect x="60" y="650" width="320" height="48" class="panel" />
  <text x="86" y="672" class="text">Default: private local finance, no</text>
  <text x="86" y="690" class="text">account or network required.</text>

  <rect x="440" y="650" width="320" height="48" class="panel" />
  <text x="466" y="672" class="text">Sync, AI analysis, payments, and</text>
  <text x="466" y="690" class="text">containers are opt-in lanes.</text>

  <rect x="820" y="650" width="320" height="48" class="panel" />
  <text x="846" y="672" class="text">Release evidence: docs, CI, SBOM,</text>
  <text x="846" y="690" class="text">checksums, package manifests.</text>
</svg>
